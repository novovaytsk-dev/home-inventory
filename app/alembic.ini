# A generic, single database configuration.

[alembic]
# путь к папке с миграциями
script_location = alembic

# шаблон для названия файлов миграций
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s

# если True, то при отсутствии изменений autogenerate не будет создавать пустую миграцию
prepend_sys_path = .

# Обычно синхронный URL для офлайн-режима, но мы переопределим его в env.py
# Можете оставить как есть или закомментировать — в env.py мы всё равно используем асинхронный URL
sqlalchemy.url = postgresql://inventory_user:inventory_pass@localhost:5432/home_inventory

[post_write_hooks]
# хуки для форматирования кода миграций (опционально)
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 88

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S